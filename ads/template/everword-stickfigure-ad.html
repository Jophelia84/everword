<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Alegreya+Sans:wght@400;500;700&display=block" rel="stylesheet">
<style>
:root{--paper:#FCFBF8;--tile:#F1EFEA;--ink:#211C1A;--muted:rgba(33,28,26,.62);--navy:#14113A;--gold:#A8813A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:var(--H);overflow:hidden;background:var(--paper)}
#stage{position:relative;width:1080px;height:var(--H);overflow:hidden;background:var(--paper)}
.disp{font-family:'Prata',Georgia,serif;color:var(--navy);letter-spacing:-.025em}
.eyebrow{font-family:'Alegreya Sans';font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase}
#art{position:absolute;transform-origin:0 0}
svg .ln{fill:none;stroke:#14113A;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
svg .gd{fill:none;stroke:#A8813A;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.caps{position:absolute;left:60px;right:60px;text-align:center}
.chunk{display:inline-block;background:var(--navy);color:var(--paper);font-family:'Alegreya Sans';font-weight:700;
  padding:10px 22px;border-radius:4px;margin:6px 0;opacity:0}
.slot{position:absolute;background:var(--tile)}
.slot .ph{position:absolute;inset:16px;border:2px dashed rgba(33,28,26,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.slot .ph svg{width:56px;height:56px;opacity:.38}
.slot .ph b{font-family:'Alegreya Sans';font-weight:700;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.slot .ph i{font-family:'Alegreya Sans';font-style:normal;font-size:22px;color:rgba(33,28,26,.45)}
.slot .fill{position:absolute;inset:0;background-size:cover;background-position:center}
#nm{position:absolute;left:0;right:0;text-align:center;font-family:'Prata';color:var(--gold);letter-spacing:.02em}
#nm span{opacity:0;display:inline-block}
#end{position:absolute;inset:0;opacity:0;text-align:center;background:var(--paper)}
#end .l{display:block;opacity:0}
.btn{display:inline-block;background:var(--navy);color:var(--paper);font-family:'Alegreya Sans';font-weight:700;
  font-size:30px;letter-spacing:.09em;text-transform:uppercase;padding:30px 52px;border-radius:2px}
</style></head>
<body><div id="stage">
  <div id="art"><svg id="svg" width="1080" height="1080" viewBox="0 0 1080 1080"></svg></div>
  <div id="prod"></div>
  <div class="caps" id="caps"></div>
  <div id="end"></div>
</div>
<script>
/* ================= EDIT HERE ================= */
const AD = {
  beats: [
    ['Stop giving gifts'],
    ['that end up', 'in a drawer.'],
    ['Give them one', 'with their name on it.'],
    ['The one they', 'never take off.'],
    ['Still wearing it,', 'years later.'],
  ],
  name: 'Maya',
  product: null,   // product photo, e.g. 'img/name-necklace.jpg'
  end: { headline:['A gift for','every chapter.'], cta:'Find their gift', url:'shopeverword.com', note:'Free standard US shipping' },
};
/* ============================================ */
const P=new URLSearchParams(location.search);
const H=+P.get('h')||1920, TALL=H>1600;
document.documentElement.style.setProperty('--H',H+'px');
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,u)=>a+(b-a)*u;
const NS='http://www.w3.org/2000/svg', svg=$('svg');
function mk(tag,attrs,parent=svg){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
const path=(d,cls='ln',parent=svg)=>mk('path',{d,class:cls,pathLength:1},parent);
function draw(e,p){e.style.strokeDasharray=1;e.style.strokeDashoffset=1-clamp(p);e.style.opacity=p>0?1:0}

/* layout */
const LAY = TALL ? {cap:260, art:{x:0,y:560,s:1}, prod:{s:560,y:720}, nm:1330} : {cap:52, art:{x:90,y:300,s:.84}, prod:{s:470,y:330}, nm:850};
$('art').style.left=LAY.art.x+'px';$('art').style.top=LAY.art.y+'px';$('art').style.transform=`scale(${LAY.art.s})`;
$('caps').style.top=LAY.cap+'px';

/* captions: each beat = 1-2 chunks */
const capEls=AD.beats.map(b=>{const d=document.createElement('div');d.style.position='absolute';d.style.left=0;d.style.right=0;
  d.innerHTML=b.map(c=>`<span class="chunk" style="font-size:${TALL?54:46}px">${c}</span>`).join('<br>');$('caps').appendChild(d);return d});

/* scene */
const scene=mk('g',{});
const floor=path('M80 880 L1000 880','ln',scene);
// dresser
const dresser=mk('g',{},scene);
const dOut=path('M820 610 L1000 610 L1000 880 L820 880 Z','ln',dresser);
const dTop=mk('g',{},dresser);
const dDrawer=path('M836 628 L984 628 L984 730 L836 730 Z','ln',dTop);
const dKnob=mk('circle',{cx:910,cy:679,r:7,fill:'#14113A',opacity:0},dTop);
const dDrawer2=path('M836 748 L984 748 L984 862 L836 862 Z','ln',dresser);
const dKnob2=mk('circle',{cx:910,cy:805,r:7,fill:'#14113A',opacity:0},dresser);
const thunk=[path('M800 600 l-26 -22','ln',dresser),path('M910 590 l0 -34','ln',dresser),path('M1020 600 l26 -22','ln',dresser)];
thunk.forEach(e=>e.style.strokeWidth=5);

// person builder: returns refs; arms are recomputed each frame
function person(x,h,opts={}){
  const g=mk('g',{transform:`translate(${x},880)`},scene), body=mk('g',{},g);
  const Lg=h*.34,T=h*.34,r=h*.105,hip=-Lg,sh=-Lg-T,hy=sh-r-6;
  const head=mk('circle',{cx:0,cy:hy,r,class:'ln',pathLength:1},body);
  const torso=path(`M0 ${sh+2} L0 ${hip}`,'ln',body);
  const legs=path(`M${-h*.1} 0 L0 ${hip} L${h*.1} 0`,'ln',body);
  const armL=mk('path',{class:'ln'},body), armR=mk('path',{class:'ln'},body);
  const extra=[];
  if(opts.hair==='long'){extra.push(path(`M${-r*.95} ${hy-r*.3} Q${-r*1.5} ${hy+r*1.2} ${-r*1.1} ${hy+r*1.9}`,'ln',body),path(`M${r*.95} ${hy-r*.3} Q${r*1.5} ${hy+r*1.2} ${r*1.1} ${hy+r*1.9}`,'ln',body))}
  if(opts.hair==='short'){extra.push(path(`M${-r} ${hy-r*.2} Q0 ${hy-r*1.6} ${r} ${hy-r*.2}`,'ln',body))}
  return {g,body,head,torso,legs,armL,armR,extra,x,h,sh,hip,hy,r};
}
function setArms(p,l,r){p.armL.setAttribute('d',`M0 ${p.sh+14} L${l[0]} ${l[1]}`);p.armR.setAttribute('d',`M0 ${p.sh+14} L${r[0]} ${r[1]}`)}
const G=person(300,440,{hair:'short'}), R=person(620,410,{hair:'long'});
// necklace on R
const neck=path(`M${-R.r*.7} ${R.sh+6} Q0 ${R.sh+70} ${R.r*.7} ${R.sh+6}`,'gd',R.body);
const pend=mk('circle',{cx:0,cy:R.sh+74,r:12,fill:'#A8813A',opacity:0},R.body);
// older R
const bun=mk('circle',{cx:0,cy:R.hy-R.r-12,r:16,class:'ln',opacity:0},R.body);
const cane=path('M110 0 L110 -190 Q110 -222 84 -222','ln',R.g);
const glasses=[mk('circle',{cx:-14,cy:R.hy+2,r:9,class:'ln',style:'stroke-width:4;opacity:0'},R.body),mk('circle',{cx:14,cy:R.hy+2,r:9,class:'ln',style:'stroke-width:4;opacity:0'},R.body)];
// gift box
const box=mk('g',{},scene);
mk('rect',{x:-36,y:-30,width:72,height:60,class:'ln',style:'fill:#FCFBF8'},box);
mk('path',{d:'M0 -30 L0 30 M-36 0 L36 0',class:'gd',style:'stroke-width:5'},box);
mk('path',{d:'M0 -30 q-22 -24 -26 -4 q8 8 26 4 q22 -24 26 -4 q-8 8 -26 4',class:'gd',style:'stroke-width:5'},box);
// hearts + sparkles
const HEART='M0 6 C0 -4 -14 -6 -14 4 C-14 12 -4 18 0 24 C4 18 14 12 14 4 C14 -6 0 -4 0 6 Z';
const hearts=[...Array(3)].map(()=>mk('path',{d:HEART,fill:'#A8813A',opacity:0}));
const STAR='M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z';
const sparks=[...Array(3)].map(()=>mk('path',{d:STAR,fill:'#A8813A',opacity:0}));
const yrs=mk('text',{x:540,y:150,'text-anchor':'middle','font-size':30,opacity:0,style:"font-family:'Alegreya Sans';font-weight:700;letter-spacing:.2em;fill:#A8813A"});yrs.textContent='30 YEARS LATER';

/* product reveal */
const IMG='<svg viewBox="0 0 24 24" fill="none" stroke="#211C1A" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M3 18l5-5 4 4 3-3 6 6"/></svg>';
const ps=LAY.prod.s;
$('prod').innerHTML=`<div class="slot" id="slot" style="left:${(1080-ps)/2}px;top:${LAY.prod.y}px;width:${ps}px;height:${ps}px;opacity:0">
  ${AD.product?`<div class="fill" style="background-image:url('${AD.product}')"></div>`:`<div class="ph">${IMG}<b>Product photo</b><i>Personalised with their name · 1:1</i></div>`}</div>
  <div id="nm" style="top:${LAY.nm}px;font-size:${TALL?110:84}px">${[...AD.name].map(c=>`<span>${c}</span>`).join('')}</div>`;

/* end */
const E=AD.end;
$('end').innerHTML=`<div style="position:absolute;left:0;right:0;top:${TALL?H*.27:H*.16}px">
  <span class="l disp" style="font-size:112px;letter-spacing:.04em;line-height:1;margin-bottom:64px;color:var(--ink)">EVERWORD</span>
  <span class="l disp" style="font-size:${TALL?84:72}px;line-height:1.05">${E.headline[0]}</span>
  <span class="l disp" style="font-size:${TALL?84:72}px;line-height:1.05;color:var(--gold)">${E.headline[1]}</span>
  <span class="l" style="margin-top:68px"><span class="btn">${E.cta} &nbsp;→</span></span>
  <span class="l" style="font-family:'Alegreya Sans';font-size:34px;font-weight:500;color:var(--ink);margin-top:44px">${E.url}</span>
  <span class="l eyebrow" style="font-size:21px;color:var(--muted);margin-top:14px">${E.note}</span></div>`;

/* timeline */
const B=[[0,2.0],[2.0,4.4],[4.4,6.8],[6.8,9.0],[9.0,11.4]], END=11.2, DUR=15;
function bez(p0,p1,p2,u){return [(1-u)*(1-u)*p0[0]+2*(1-u)*u*p1[0]+u*u*p2[0],(1-u)*(1-u)*p0[1]+2*(1-u)*u*p1[1]+u*u*p2[1]]}

window.render=function(t){
  // captions: chunk by chunk
  capEls.forEach((c,i)=>{const[a,b]=B[i];const vis=t>=a&&t<b+(i===4?-.2:0);
    [...c.querySelectorAll('.chunk')].forEach((ch,j)=>{const p=back((t-a-.1-j*.5)/.35);ch.style.opacity=vis?clamp(p):0;ch.style.transform=`scale(${.9+.1*clamp(p,0,1.1)})`})});

  // scene visibility: hidden during product beat
  const sv=1-clamp((t-B[2][0])/.3)+clamp((t-B[3][0]+.1)/.3);
  scene.style.opacity=clamp(sv)*(1-clamp((t-END)/.3));
  draw(floor,(t-.05)/.5);
  [dOut,dDrawer,dDrawer2].forEach((e,i)=>draw(e,(t-.15-i*.1)/.5));
  dKnob.setAttribute('opacity',t>.7?1:0);dKnob2.setAttribute('opacity',t>.7?1:0);
  [G,R].forEach((p,i)=>{draw(p.head,(t-.2-i*.15)/.4);draw(p.torso,(t-.35-i*.15)/.3);draw(p.legs,(t-.45-i*.15)/.4);p.extra.forEach(e=>draw(e,(t-.5-i*.15)/.3))});
  // dresser only matters early; fade it away after beat 2
  dresser.style.opacity=1-clamp((t-B[3][0])/.3);

  // gift: giver -> receiver -> drawer
  const hand1=[G.x+120,880+G.sh+70], hand2=[R.x-70,880+R.sh+80], drawerPt=[910,679];
  const u1=inout((t-.9)/.8), u2=inout((t-2.6)/.7);
  let bp=hand1; if(t>.9)bp=[lerp(hand1[0],hand2[0],u1),lerp(hand1[1],hand2[1],u1)-Math.sin(u1*Math.PI)*60];
  if(t>2.6)bp=bez(hand2,[800,300],drawerPt,u2);
  const drawerOpen=clamp((t-2.15)/.35)-clamp((t-3.3)/.15);
  dTop.setAttribute('transform',`translate(0,${drawerOpen*-0})`);
  dDrawer.setAttribute('transform',`translate(${0},0) scale(1)`);
  // drawer "opens" by sliding down a little and widening the gap
  dTop.setAttribute('transform',`translate(0,${drawerOpen*34})`);
  const inDrawer=t>3.3;
  box.setAttribute('transform',`translate(${bp[0]},${bp[1]}) scale(${t>2.6?1-u2*.5:1})`);
  box.style.opacity=(t<.6?0:1)*(inDrawer?0:1)*(1-clamp((t-B[2][0])/.2));
  const th=clamp((t-3.42)/.12)*(1-clamp((t-3.9)/.2));thunk.forEach(e=>{e.style.opacity=th;e.style.strokeDasharray='';});

  // arms
  const gReach=t<1.7?[120,G.sh+70]:[60,G.sh+150];
  setArms(G,[-60,G.sh+150],gReach);
  let rL=[-60,R.sh+150], rR=[60,R.sh+150];
  if(t>1.2&&t<2.7){rL=[-70,R.sh+80];rR=[-40,R.sh+90]}             // hands out to take it
  if(t>3.6&&t<4.4){const s=Math.sin(clamp((t-3.6)/.8)*Math.PI);rL=[-80,R.sh-30*s];rR=[80,R.sh-30*s]} // shrug
  if(t>B[3][0]&&t<B[4][0]){rR=[14,R.sh+70]}                       // touching the pendant
  setArms(R,rL,rR);
  [G.armL,G.armR,R.armL,R.armR].forEach(a=>a.style.opacity=t>.6?1:0);

  // product reveal
  const pin=ease((t-B[2][0]-.1)/.5)*(1-clamp((t-B[3][0])/.3));
  $('slot').style.opacity=pin;$('slot').style.transform=`scale(${.92+.08*pin})`;
  const chars=$('nm').children;[...chars].forEach((c,i)=>{const p=back((t-B[2][0]-1.0-i*.16)/.3);c.style.opacity=clamp(p)*(1-clamp((t-B[3][0])/.3));c.style.transform=`translateY(${(1-clamp(p,0,1.2))*20}px)`});

  // necklace + hearts
  const nk=t>B[3][0];draw(neck,nk?(t-B[3][0]-.2)/.4:0);pend.setAttribute('opacity',nk&&t>B[3][0]+.5?1:0);
  hearts.forEach((h,i)=>{const a=B[3][0]+.7+i*.35,u=clamp((t-a)/1.2);
    if(t>a&&u<1){h.setAttribute('transform',`translate(${R.x+(i-1)*70},${880+R.hy-60-u*120}) scale(${1+.3*Math.sin(u*Math.PI)})`);h.setAttribute('opacity',Math.sin(u*Math.PI))}else h.setAttribute('opacity',0)});
  // G leaves before "years later"
  G.g.style.opacity=1-clamp((t-B[4][0]+.1)/.4);
  // aging
  const ag=clamp((t-B[4][0])/.6);
  bun.setAttribute('opacity',ag);glasses.forEach(gl=>gl.style.opacity=ag);
  R.extra.forEach(e=>e.style.opacity=t>B[4][0]?1-ag:e.style.opacity);
  draw(cane,t>B[4][0]?(t-B[4][0]-.2)/.5:0);
  R.body.setAttribute('transform',`translate(${ag*-6},0) rotate(${ag*-5} 0 ${R.hip})`);
  if(t>B[4][0])setArms(R,[-60,R.sh+150],[100,R.sh+170]);
  yrs.setAttribute('opacity',ease((t-B[4][0]-.1)/.4)*(1-clamp((t-END)/.3)));
  sparks.forEach((s,i)=>{const a=B[4][0]+.8+i*.3,u=clamp((t-a)/.6);
    s.setAttribute('opacity',t>a&&u<1?Math.sin(u*Math.PI):0);s.setAttribute('transform',`translate(${R.x+[-34,30,4][i]},${880+R.sh+[60,90,40][i]}) scale(${.5+u*.6}) rotate(${u*90})`)});

  // end
  $('art').style.opacity=1-clamp((t-END)/.3);
  $('caps').style.opacity=1-clamp((t-END)/.3);
  $('end').style.opacity=clamp((t-END)/.35);
  [...$('end').querySelectorAll('.l')].forEach((s,i)=>{const p=ease((t-END-.15-i*.13)/.7);s.style.opacity=p;s.style.transform=`translateY(${(1-p)*24}px)`});
};
window.DUR=DUR;render(0);
</script></body></html>
